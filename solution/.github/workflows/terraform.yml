# ---------------------------------------------------------------------------
# Terraform CI -- lint, validate, plan
# ---------------------------------------------------------------------------
# Triggered on PRs and pushes that touch terraform code. Two jobs:
#   1. lint-validate: fmt + tflint + validate. No AWS credentials needed.
#   2. plan: runs `terraform plan` against real state via OIDC. Posts the
#      plan as a PR comment so reviewers can see what will change.
#
# On merge to main the same workflow runs -- it stops at `plan`, which is
# the "simulated apply" the assessment asks for. To promote to real apply
# later, add a third job gated on a GitHub Environment with required
# reviewers (see notes in solution/README.md).
#
# NOTE: this file currently lives under solution/.github/workflows/ to keep
# the assessment self-contained. To activate it on GitHub, move it to the
# repo root `.github/workflows/` -- GitHub only reads workflows from there.
# ---------------------------------------------------------------------------

name: terraform

on:
  pull_request:
    paths:
      - "solution/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "solution/terraform/**"
      - ".github/workflows/terraform.yml"

# OIDC needs `id-token: write`. `contents: read` is the checkout default.
# `pull-requests: write` lets the plan job post the diff as a PR comment.
permissions:
  id-token: write
  contents: read
  pull-requests: write

# Cancel in-progress runs if a new commit lands on the same PR / branch.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.2"
  TF_WORKING_DIR: solution/terraform

jobs:
  # -------------------------------------------------------------------------
  # Job 1: lint + validate (no AWS creds, fast)
  # -------------------------------------------------------------------------
  lint-validate:
    name: fmt + tflint + validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # `terraform fmt -check` exits non-zero if any file is not formatted.
      # Keeping formatting enforced in CI means review comments never have
      # to mention whitespace.
      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: Setup TFLint
        uses: terraform-linter/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --format compact

      # -backend=false lets validate run without any backend credentials.
      # Validate only checks syntax + references -- no API calls.
      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  # -------------------------------------------------------------------------
  # Job 2: plan against real state (requires OIDC + backend credentials)
  # -------------------------------------------------------------------------
  # This job is optional for a first-time setup -- the IAM role it assumes
  # is CREATED by Terraform itself. Bootstrap order:
  #   1. Run `terraform apply` locally (with human creds) to create the
  #      role + the rest of the infra.
  #   2. Copy `terraform output github_actions_role_arn` into the GitHub
  #      repo variable `AWS_ROLE_ARN`.
  #   3. Subsequent PRs + pushes run this job automatically.
  #
  # Until the variable is set, the job is skipped cleanly via the `if` guard.
  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    needs: lint-validate
    if: vars.AWS_ROLE_ARN != ''

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # OIDC -- no stored AWS keys. The IAM role's trust policy only
      # allows assumption from THIS repo (enforced by the `sub` condition
      # in compute/main.tf).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: terraform init

      # The password is supplied via TF_VAR_db_password from GitHub Secrets.
      # All other vars come from terraform.tfvars (committed without secrets)
      # or repo variables.
      - name: terraform plan
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_allowed_ssh_cidr: ${{ vars.ALLOWED_SSH_CIDR }}
          TF_VAR_key_name: ${{ vars.KEY_NAME }}
          TF_VAR_github_repo: ${{ github.repository }}
        run: |
          terraform plan \
            -no-color \
            -out=tfplan \
            -input=false \
          | tee plan-output.txt

      # On PRs, post the plan as a comment so reviewers can see the diff
      # without digging into the Actions log.
      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(
              '${{ env.TF_WORKING_DIR }}/plan-output.txt',
              'utf8'
            );
            // GitHub comments cap at ~65k chars. Truncate if needed.
            const body = [
              '### Terraform Plan',
              '```',
              plan.length > 60000 ? plan.slice(0, 60000) + '\n... (truncated)' : plan,
              '```',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
